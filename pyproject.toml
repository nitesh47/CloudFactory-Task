[project]
name = "cloudfactory-task"
version = "0.2.0"
description = "Invoice field extraction system with HITL support"
authors = [
    {name = "niteshpandey", email = "n.pandey@breezeventures.io"}
]
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "python-doctr[torch]>=0.9.0",
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "torch>=2.0.0",
    "onnxruntime>=1.16.0",
    "opencv-python-headless>=4.8.0",
    "openai (>=2.15.0,<3.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]

[project.scripts]
invoice-extract = "src.invoice_extractor.cli:main"

[tool.poetry]
packages = [{include = "invoice_extractor", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"